key_finding: Fuel poverty is structurally different from ordinary poverty — it is
  an infrastructure crisis, not just an income crisis. Poor households ration heating
  ("heat or eat"), and the only lasting solution is capital investment in housing
  fabric (insulation, efficient boilers), not cash handouts. The 10% threshold (required
  spend > 10% of income) was derived as twice the national median energy expenditure.
