key_finding: 'Urbanization has ambiguous effects on energy poverty in Mozambique (2003–2015): energy consumption poverty and lack of modern fuel access decline, but energy expenditure poverty rises. Population density shows a U-shaped relationship with modern fuel poverty and an inverted N-shaped relationship with expenditure poverty. National welfare surveys overestimate consumption poverty and underestimate expenditure poverty by ignoring transport energy.'
