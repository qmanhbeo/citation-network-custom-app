key_finding: Building energy use varies widely across metropolitan Los Angeles. Building
  age, household income, home ownership rates, and land use are all correlated with
  energy consumption. High-income areas use more energy per building, while lower-income
  areas use more energy per square-foot, correlating with older building ages in lower-income
  neighborhoods.
